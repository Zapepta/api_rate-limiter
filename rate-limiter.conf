network = tcp #unix
addr    = :8080 #./rate-limiter.sock

# Backend Capacity (Formula: backend_rps = backend_burst / avg_query_latency_sec)
backend_burst = 5.0    # DB pool size (go max_open_conns / PgBouncer / HikariCP)
backend_rps   = 140.0  # Grafana APM (sustained RPS before p95 latency spikes)

# Client Quotas
client_burst  = 2.0    # Allowed rapid UI clicks per user before throttling
client_rps    = 1.0    # Contractual rate limit per IP/token from your API docs